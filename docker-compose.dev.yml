services:
  dev-nextapp:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: https://lc.envai.tr
        NEXT_PUBLIC_ASSISTANT_ID: google3

    container_name: dev-envaichat
    ports:
      - "192.168.1.160:3002:3000"
    environment:
      NODE_ENV: production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'     # max 1 CPU core
          memory: 2G    # max 512 MB RAM
    networks:
      - envai-chat-dev

networks:
  envai-chat-dev:
    name: envai-chat-dev
