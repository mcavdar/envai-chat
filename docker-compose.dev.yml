services:
  dev-nextapp:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: https://lg.envai.tr
        NEXT_PUBLIC_ASSISTANT_ID: mock
        NEXT_PUBLIC_GRAPH_IDS: translation,deep-research,minimax-chat,weather-tool,zai-glm,zai-free-chat,zai-free-vision,factorial-tool,factorial-workflow,math-tutor,human-weather,gemini-live,gemini-chat,gemini-chat-v3,youtube-downloader,gemma-chat,ollama-vision,ocr-reader,claude-chat,mock
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}

    container_name: dev-envaichat
    ports:
      - "192.168.1.160:3002:3000"
    environment:
      NODE_ENV: production
      LANGGRAPH_API_URL: https://lg.envai.tr
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'     # max 1 CPU core
          memory: 2G    # max 512 MB RAM
    networks:
      - envai-chat-dev

networks:
  envai-chat-dev:
    name: envai-chat-dev
